name: Kestrel
options:
  bundleIdPrefix: com.simnetiq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.23.2

settings:
  base:
    DEVELOPMENT_TEAM: F7YY9U667A
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Kestrel:
    type: application
    platform: iOS
    sources:
      - path: Kestrel
    dependencies:
      - package: secp256k1
        product: libsecp256k1
      - target: KestrelWidget
    entitlements:
      path: Kestrel/Kestrel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.simnetiq.kestrel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simnetiq.kestrel
        PRODUCT_NAME: Kestrel
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Kestrel/Info.plist
    info:
      path: Kestrel/Info.plist
      properties:
        CFBundleDisplayName: Kestrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: group.com.simnetiq.kestrel
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Kestrel uses Face ID to unlock the app and confirm transfers.
        NSCameraUsageDescription: Kestrel uses the camera to scan a wallet address QR code.
        CFBundleURLTypes:
          - CFBundleURLName: com.simnetiq.kestrel
            CFBundleURLSchemes: [kestrel]

  KestrelWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KestrelWidget
      - path: Kestrel/Shared
    entitlements:
      path: KestrelWidget/KestrelWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.simnetiq.kestrel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simnetiq.kestrel.widget
        PRODUCT_NAME: KestrelWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: Background
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KestrelWidget/Info.plist
    info:
      path: KestrelWidget/Info.plist
      properties:
        CFBundleDisplayName: Kestrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: group.com.simnetiq.kestrel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  KestrelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KestrelTests
    dependencies:
      - target: Kestrel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simnetiq.kestrel.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kestrel.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kestrel
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Kestrel:
    build:
      targets:
        Kestrel: all
        KestrelTests: [test]
    test:
      targets:
        - KestrelTests
    archive:
      config: Release
